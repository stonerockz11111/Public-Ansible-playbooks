---
- name: Update hash Password of {{ target_user }}
  hosts: all 
  become: yes 
  vars_files:
   - ../group_vars/servers.yml
  tasks:
    - name: Make backup of existing shadow file
      ansible.builtin.shell:
        cmd:  cp shadow shadow-backup-$(date +%d-%m-%y)
        chdir: /etc/ 

    - name: Update hash passord on testuser user
      ansible.builtin.user:
        name: "{{ target_user }}"
        password: "{{ hash_password }}"
        update_password: always

      

      
      